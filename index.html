<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SkeletonKey</title>
        <meta
            name="description"
            content="A private, local-first key to your own existence: records, places, people, money, timelines, and narrative"
        />

        <!-- Favicon -->
        <link rel="icon" type="image/svg+xml" href="/logo.svg" />

        <!-- Preload fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <!-- Theme color for browsers -->
        <meta name="theme-color" content="#1E293B" />

        <!-- Prevent FOUC (Flash of Unstyled Content) -->
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
                font-family:
                    "Inter",
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    Oxygen,
                    Ubuntu,
                    Cantarell,
                    "Open Sans",
                    "Helvetica Neue",
                    sans-serif;
                background-color: #f9fafb;
                color: #111827;
            }

            @media (prefers-color-scheme: dark) {
                html,
                body {
                    background-color: #111827;
                    color: #f9fafb;
                }
            }

            #root {
                height: 100%;
                display: flex;
                flex-direction: column;
            }

            .loading-screen {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background-color: #f9fafb;
                color: #111827;
                transition: opacity 0.3s ease-out;
                z-index: 9999;
            }

            @media (prefers-color-scheme: dark) {
                .loading-screen {
                    background-color: #111827;
                    color: #f9fafb;
                }
            }

            .loading-screen.fade-out {
                opacity: 0;
                pointer-events: none;
            }

            .loading-icon {
                width: 64px;
                height: 64px;
                margin-bottom: 1rem;
                animation: pulse 1.5s infinite ease-in-out;
            }

            @keyframes pulse {
                0% {
                    transform: scale(0.95);
                    opacity: 0.7;
                }
                50% {
                    transform: scale(1.05);
                    opacity: 1;
                }
                100% {
                    transform: scale(0.95);
                    opacity: 0.7;
                }
            }

            .loading-text {
                font-size: 1.25rem;
                font-weight: 500;
                margin-top: 1rem;
            }

            .loading-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                border: 0.25rem solid rgba(59, 130, 246, 0.3);
                border-radius: 50%;
                border-top-color: rgba(59, 130, 246, 1);
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>

        <!-- Initial loading screen (shown until React loads) -->
        <div id="loading-screen" class="loading-screen">
            <div class="loading-icon">
                <svg
                    width="64"
                    height="64"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        d="M12 2L2 7L12 12L22 7L12 2Z"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    <path
                        d="M2 17L12 22L22 17"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    <path
                        d="M2 12L12 17L22 12"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </div>
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading SkeletonKey...</div>
        </div>

        <!-- React root -->
        <div id="root"></div>

        <!-- Script to handle loading screen -->
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                // Fade out loading screen once the app has loaded
                window.addEventListener("load", function () {
                    setTimeout(function () {
                        const loadingScreen =
                            document.getElementById("loading-screen");
                        if (loadingScreen) {
                            loadingScreen.classList.add("fade-out");
                            setTimeout(function () {
                                loadingScreen.style.display = "none";
                            }, 300);
                        }
                    }, 500);
                });
            });
        </script>

        <!-- Entry script for React app -->
        <script type="module" src="/src/main.tsx"></script>
        <script>
            console.log(
                "%c[Inline HTML Script Check - Sync] typeof window.__TAURI_IPC__:",
                "color: green; font-weight: bold;",
                typeof window.__TAURI_IPC__,
                window.__TAURI_IPC__,
            );
            console.log(
                "%c[Inline HTML Script Check - Sync] typeof window.__TAURI_METADATA__:",
                "color: green; font-weight: bold;",
                typeof window.__TAURI_METADATA__,
                window.__TAURI_METADATA__,
            );
            setTimeout(() => {
                console.log(
                    "%c[Inline HTML Script Check - Async 100ms] typeof window.__TAURI_IPC__:",
                    "color: orange; font-weight: bold;",
                    typeof window.__TAURI_IPC__,
                    window.__TAURI_IPC__,
                );
                console.log(
                    "%c[Inline HTML Script Check - Async 100ms] typeof window.__TAURI_METADATA__:",
                    "color: orange; font-weight: bold;",
                    typeof window.__TAURI_METADATA__,
                    window.__TAURI_METADATA__,
                );
            }, 100);
        </script>
    </body>
</html>
